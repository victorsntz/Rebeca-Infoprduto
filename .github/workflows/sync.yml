name: Publicar

# Gera a versão "pronta pra hospedagem" e coloca na branch `publicar` deste repositório:
#   raiz da branch = conteúdo de site/ (landing na raiz, área de membros em app/) + PDFs em dist/
# A Hostinger serve essa branch pela raiz, no domínio do produto (ver README, "Publicar").
#
# Publicar na hora:  gh workflow run sync.yml -R victorsntz/Rebeca-Infoprduto --ref main
# Todo push na main que mexa em site/ ou nos PDFs também publica sozinho.

on:
  push:
    branches: [main]
    paths: ["site/**", "dist/*.pdf", ".github/workflows/sync.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    name: Montar o pacote e enviar pra branch publicar
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Montar o pacote
        run: |
          set -e
          rm -rf /tmp/pacote && mkdir -p /tmp/pacote/dist
          rsync -a --exclude 'dist/' site/ /tmp/pacote/
          cp dist/*.pdf /tmp/pacote/dist/
          test -f /tmp/pacote/index.html
          test -f /tmp/pacote/app/index.html
          test -f /tmp/pacote/dist/de-tola-a-virtuosa.pdf
          # Bloqueia pastas que não são pra ver e cache de assets (Apache/Hostinger).
          cat > /tmp/pacote/.htaccess <<'EOF'
          ErrorDocument 404 /index.html
          RedirectMatch 404 ^/\.git
          RedirectMatch 404 ^/\.github
          RedirectMatch 404 ^/app/supabase
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 7 days"
            ExpiresByType application/javascript "access plus 7 days"
            ExpiresByType image/png "access plus 30 days"
            ExpiresByType image/jpeg "access plus 30 days"
            ExpiresByType image/svg+xml "access plus 30 days"
            ExpiresByType font/ttf "access plus 365 days"
          </IfModule>
          EOF
          # Remove o que é só de desenvolvimento.
          rm -rf /tmp/pacote/app/supabase

      - name: Enviar pra branch publicar
        run: |
          set -e
          cd /tmp/pacote
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b publicar
          git add -A
          git commit -q -m "Publicação automática ($(date -u '+%Y-%m-%d %H:%M') UTC) a partir de ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
