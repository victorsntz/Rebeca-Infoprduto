name: Manter o banco acordado

# O Supabase grátis pausa o projeto depois de alguns dias sem uso, e aí o app mostra "Sem conexão".
# Esta ação chama uma função mínima do banco a cada dois dias pra ele continuar ativo.

on:
  schedule:
    - cron: "17 11 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tocar no banco
        run: |
          set -e
          URL="https://stcskyelzuynfnmdrnth.supabase.co/rest/v1/rpc/ping"
          KEY="sb_publishable_qRZtPer3nwwQqo3J-T2qPQ_yLJpGDQv"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$URL" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "tentativa $i: HTTP $code $(cat /tmp/r.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::O banco não respondeu. Veja se o projeto foi pausado no painel do Supabase."
          exit 1
