<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Caveat";src:url("fonts/caveat-500.ttf")}
@font-face{font-family:"Caslon";src:url("../site/assets/fonts/LibreCaslonText-Regular.ttf")}
body{margin:0;background:#333}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;margin:0 0 20px}
.post svg{position:absolute;inset:0}
.frase{position:absolute;left:0;right:0;top:490px;text-align:center;font-family:"Caveat";font-size:118px;line-height:1.02}
.at{position:absolute;left:0;right:0;bottom:118px;text-align:center;font-family:"Caslon";font-size:17px;letter-spacing:.24em}
</style></head><body>
<script>
// Coração desenhado à mão, um lado um pouco maior que o outro.
const CORACAO = "M540,520 C502,404 380,366 298,428 C214,492 228,616 300,704 C372,792 470,862 520,932 C531,947 546,946 553,929 C604,850 704,770 774,680 C846,588 850,462 772,402 C690,342 580,396 540,520 Z";
const V = [
  { fundo:"#3F1019", coracao:"#6B2231", texto:"#F6EEE6", at:"#E8D9CC" },
  { fundo:"#5E1A26", coracao:"#874050", texto:"#F6EEE6", at:"#EBDCD0" },
  { fundo:"#F3E9DF", coracao:"#E4C6C4", texto:"#5E1A26", at:"#8E2A3A" },
];
V.forEach((c, i) => document.body.insertAdjacentHTML("beforeend", `
<div class="post" id="p${i + 1}" style="background:${c.fundo}">
  <svg viewBox="0 0 1080 1350" width="1080" height="1350">
    <defs><filter id="g${i}" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${i + 4}"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
    </filter></defs>
    <path d="${CORACAO}" fill="${c.coracao}" transform="rotate(-3 540 660)"/>
    <rect width="1080" height="1350" filter="url(#g${i})"/>
  </svg>
  <div class="frase" style="color:${c.texto}">Jesus é<br>constante<br>em te amar</div>
  <div class="at" style="color:${c.at}">@REBECAFORTUNATO__</div>
</div>`));
</script>
</body></html>
