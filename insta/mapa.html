<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///home/user/Rebeca-Infoprduto/site/assets/brand.css">
<style>
@font-face{font-family:"Caveat";src:url("file:///tmp/claude-0/-home-user-Rebeca-Infoprduto/f44a588c-76ca-527d-8433-d1071a513749/scratchpad/fonts/caveat-500.ttf");font-weight:500}
@font-face{font-family:"Caveat";src:url("file:///tmp/claude-0/-home-user-Rebeca-Infoprduto/f44a588c-76ca-527d-8433-d1071a513749/scratchpad/fonts/caveat-700.ttf");font-weight:700}
body{margin:0;background:#333}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;margin:0 0 20px;background:#EFE6D9;font-family:"Caveat",cursive}
.post .tex{position:absolute;inset:0;opacity:.5;background:
  radial-gradient(60% 40% at 20% 80%, rgba(184,151,91,.18), transparent 70%),
  radial-gradient(50% 35% at 80% 30%, rgba(142,42,58,.08), transparent 70%),
  radial-gradient(40% 30% at 55% 55%, rgba(255,255,255,.5), transparent 70%)}
.post .noise{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}
.post .shape{position:absolute;background:#7A8C74;left:160px;top:-40px;width:1000px;height:420px;clip-path:polygon(0 0,100% 0,100% 100%,78% 100%,60% 42%,40% 34%,0 48%);opacity:.9}
.post .shape2{position:absolute;background:#8E9A82;right:0;top:0;width:260px;height:1350px;clip-path:polygon(70% 0,100% 0,100% 100%,55% 100%);opacity:.75}
.post svg.lines{position:absolute;inset:0;width:100%;height:100%}
.post .c{position:absolute;left:0;right:0;top:560px;text-align:center;font-weight:700;color:#8E2A3A;font-size:150px;line-height:.9;transform:rotate(-4deg)}
.post .c small{display:block;font-size:64px;font-weight:500;color:#3F1019;transform:rotate(2deg);margin-bottom:6px}
.post .a{position:absolute;font-size:56px;font-weight:500;color:#8E2A3A;line-height:.95;white-space:nowrap}
.post .at{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:40px;color:#5a4a44;font-weight:500}
.post .lil{position:absolute}
.post.dark{background:#3F1019}
.post.dark .shape{background:#5E1A26}.post.dark .shape2{background:#4B2C3C}
.post.dark .c{color:#E8C27A}.post.dark .c small{color:#F9F5EE}
.post.dark .a{color:#F3E6C9}.post.dark .at{color:rgba(249,245,238,.6)}
.post.dark .tex{opacity:.25}
</style></head><body>
<script>
function lily(cx, cy, r, rot, seed){
  // seis pétalas, três de trás maiores e três da frente menores; perspectiva por scaleY
  let s = seed, rnd = () => { s = (s*9301+49297)%233280; return s/233280; };
  const petal = (len, w, ang, inner) => {
    const g = inner ? 'url(#pin)' : 'url(#pout)';
    const sp = [];
    for (let i=0;i<26;i++){ const t = 0.08+rnd()*0.4; const x = (rnd()-0.5)*w*1.1*(0.5+t); const y = -t*len; sp.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(1+rnd()*1.4).toFixed(1)}" ry="${(1.8+rnd()*2.4).toFixed(1)}" fill="#5a1022" opacity="${(0.45+rnd()*0.4).toFixed(2)}"/>`); }
    const curl = (rnd()-0.5)*26, tip = len*(0.96+rnd()*0.06);
    const d = `M0,0 C ${-w*0.7},${-len*0.14} ${-w*1.05},${-len*0.62} ${curl-w*0.06},${-tip*0.985} Q ${curl},${-tip*1.01} ${curl+w*0.06},${-tip*0.985} C ${w*1.05},${-len*0.62} ${w*0.7},${-len*0.14} 0,0 Z`;
    return `<g transform="rotate(${ang})">
      <path d="${d}" fill="${g}" stroke="#F8E9E6" stroke-opacity=".42" stroke-width="1.3"/>
      <path d="M ${curl-w*0.5},${-len*0.72} Q ${curl},${-len*0.88} ${curl+w*0.5},${-len*0.72}" stroke="#8E2240" stroke-opacity=".28" stroke-width="3" fill="none"/>
      <path d="M0,0 C ${-w*0.28},${-len*0.3} ${-w*0.14},${-len*0.6} ${curl*0.7},${-len*0.8} C ${w*0.14},${-len*0.6} ${w*0.28},${-len*0.3} 0,0 Z" fill="#C64B69" opacity=".22"/>
      <path d="M0,-4 C ${curl*0.3},${-len*0.45} ${curl*0.6},${-len*0.75} ${curl},${-len*0.95}" stroke="#FBF2EE" stroke-opacity=".6" stroke-width="2" fill="none"/>
      ${sp.join('')}</g>`;
  };
  const back = [0,120,240].map((a,i) => petal(r*(1.0+ (i%2)*0.05), r*0.36, a+rot+8+(rnd()-0.5)*12, false)).join('');
  const front = [60,180,300].map((a,i) => petal(r*0.94, r*0.44, a+rot-6+(rnd()-0.5)*12, true)).join('');
  const stamens = [0,1,2,3,4,5].map(i => { const a = (i*60+rot+30)*Math.PI/180; const L = r*0.55+rnd()*r*0.1; const x=Math.cos(a)*L, y=Math.sin(a)*L; return `<path d="M0,0 Q ${x*0.5},${y*0.5-6} ${x},${y}" stroke="#F1E2C6" stroke-width="2.2" fill="none"/><ellipse cx="${x}" cy="${y}" rx="9" ry="4.5" transform="rotate(${i*60+rot+30} ${x} ${y})" fill="#5b2a14"/>`; }).join('');
  const pist = (() => { const a=(rot+90)*Math.PI/180; const L=r*0.62; const x=Math.cos(a)*L,y=Math.sin(a)*L; return `<path d="M0,0 L ${x},${y}" stroke="#E9D6B5" stroke-width="3"/><circle cx="${x}" cy="${y}" r="6" fill="#8d4b2c"/>`; })();
  return `<g transform="translate(${cx} ${cy}) rotate(${rot*0.6}) scale(${(0.86+rnd()*0.14).toFixed(2)} ${(0.72+rnd()*0.16).toFixed(2)})"><g opacity=".98">${back}</g><g>${front}</g><circle r="${r*0.11}" fill="url(#core)"/>${stamens}${pist}</g>`;
}
function leaf(x,y,len,ang){ return `<path transform="translate(${x} ${y}) rotate(${ang})" d="M0,0 C 18,-22 ${len*0.5},-${len*0.22} ${len},-6 C ${len*0.5},${len*0.18} 18,14 0,0 Z" fill="url(#leaf)" stroke="#C9CFB0" stroke-opacity=".35" stroke-width="1"/><path transform="translate(${x} ${y}) rotate(${ang})" d="M4,-1 L ${len-8},-5" stroke="#E3E6CF" stroke-opacity=".35" stroke-width="1.2"/>`; }
function art(seed){
  const defs = `<defs>
    <linearGradient id="pout" x1="0" y1="0" x2="0" y2="-1" gradientUnits="objectBoundingBox" gradientTransform="rotate(90)"><stop offset="0" stop-color="#FBF3EE"/><stop offset=".3" stop-color="#F2C9CC"/><stop offset=".7" stop-color="#D9798F"/><stop offset="1" stop-color="#9E2B49"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="-1" gradientTransform="rotate(90)"><stop offset="0" stop-color="#FFF8F3"/><stop offset=".32" stop-color="#F6D6D6"/><stop offset=".72" stop-color="#E48FA2"/><stop offset="1" stop-color="#B0365A"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#F7E9C9"/><stop offset="1" stop-color="#D9A86B" stop-opacity=".2"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E9A72"/><stop offset="1" stop-color="#4F5B3E"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>`;
  const stems = `
    <g class="stem-tr"><path d="M 1010,120 C 960,260 930,330 880,420" stroke="#6F7A56" stroke-width="5" fill="none" stroke-linecap="round"/>
    ${leaf(905,380,130,-115)}${leaf(950,300,110,-30)}</g>
    <g class="stem-bl"><path d="M 60,1300 C 110,1200 150,1150 190,1090" stroke="#6F7A56" stroke-width="5" fill="none" stroke-linecap="round"/>
    ${leaf(120,1210,120,-150)}${leaf(100,1250,100,-15)}</g>`;
  return `<svg class="art" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">${defs}${stems}
    <g class="lily-tr">${lily(905,215,135,18,seed+1)}</g><g class="lily-bl">${lily(190,1090,95,-35,seed+2)}</g></svg>`;
}

const ATTR = [
  ['sábia',                 700, 300, -6, [700,350, 615,600]],
  ['prudente',              790, 430,  4, [790,478, 690,615]],
  ['bondosa',               850, 560, -3, [845,598, 760,650]],
  ['forte e corajosa',      640, 850,  3, [700,850, 700,785]],
  ['imagem e semelhança',   470, 1040, -4, [620,1040, 600,800]],
  ['mais preciosa que rubis', 60, 950,  3, [330,948, 420,790]],
  ['fiel no pouco',          70, 760, -5, [310,790, 365,735]],
  ['edifica a casa',         80, 560,  4, [345,592, 405,650]],
  ['temente a Deus',        120, 400, -4, [420,440, 470,615]],
  ['agraciada',             330, 270,  5, [470,330, 520,595]],
];
const CENTER = [540, 690];
function wob(x1,y1,x2,y2,s){ let r=s; const rnd=()=>{r=(r*9301+49297)%233280;return r/233280-0.5;}; const mx=(x1+x2)/2+rnd()*70, my=(y1+y2)/2+rnd()*70; return `M${x1},${y1} Q${mx},${my} ${x2},${y2}`; }
function post(cls, seed){
  const lines = ATTR.map((a,i)=>{ const [x1,y1,x2,y2]=a[4]; return `<path d="${wob(x1,y1,x2,y2,seed+i)}" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round" opacity=".9"/>`; }).join('');
  const doodles = `<path d="M560,470 c-6,-12 -22,-8 -18,6 c3,10 18,16 18,16 s15,-6 18,-16 c4,-14 -12,-18 -18,-6z" fill="none" stroke="currentColor" stroke-width="3" opacity=".8"/>
    <g transform="translate(250,650)" stroke="currentColor" fill="none" stroke-width="2.6" opacity=".75"><circle r="5"/><path d="M0,-6 v-14 M0,6 v14 M-6,0 h-14 M6,0 h14 M-4,-4 l-9,-9 M4,4 l9,9 M-4,4 l-9,9 M4,-4 l9,-9"/><path d="M0,20 c-4,18 2,30 6,40"/></g>
    <g transform="translate(880,980)" stroke="currentColor" fill="none" stroke-width="2.6" opacity=".75"><circle r="5"/><path d="M0,-6 v-14 M0,6 v14 M-6,0 h-14 M6,0 h14 M-4,-4 l-9,-9 M4,4 l9,9 M-4,4 l-9,9 M4,-4 l9,-9"/><path d="M0,20 c4,18 -2,30 -6,40"/></g>
    <path d="M330,745 q60,14 120,-4" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5"/>`;
  const attrs = ATTR.map(a=>`<div class="a" style="left:${a[1]}px;top:${a[2]}px;transform:rotate(${a[3]}deg)">${a[0]}</div>`).join('');
  const lil = `<svg class="lil" style="left:40px;top:60px;width:260px;height:260px" viewBox="0 0 260 260"><defs>
    <linearGradient id="pout" x1="0" y1="0" x2="0" y2="-1" gradientUnits="objectBoundingBox" gradientTransform="rotate(90)"><stop offset="0" stop-color="#FBF3EE"/><stop offset=".3" stop-color="#F2C9CC"/><stop offset=".7" stop-color="#D9798F"/><stop offset="1" stop-color="#9E2B49"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="-1" gradientTransform="rotate(90)"><stop offset="0" stop-color="#FFF8F3"/><stop offset=".32" stop-color="#F6D6D6"/><stop offset=".72" stop-color="#E48FA2"/><stop offset="1" stop-color="#B0365A"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#F7E9C9"/><stop offset="1" stop-color="#D9A86B" stop-opacity=".2"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E9A72"/><stop offset="1" stop-color="#4F5B3E"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>${lily(130,130,95,15,seed+1)}</svg>
   <svg class="lil" style="right:30px;bottom:140px;width:220px;height:220px" viewBox="0 0 220 220">${lily(110,110,80,-30,seed+2)}</svg>`;
  return `<div class="post ${cls}"><div class="shape"></div><div class="shape2"></div><div class="tex"></div>
    <svg class="noise" viewBox="0 0 1080 1350" preserveAspectRatio="none"><filter id="n${seed}"><feTurbulence baseFrequency=".9" numOctaves="2" seed="${seed}"/><feColorMatrix values="0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .15 0 0 0 .5 0"/></filter><rect width="1080" height="1350" filter="url(#n${seed})"/></svg>
    <svg class="lines" viewBox="0 0 1080 1350" style="color:${cls==='dark'?'#E8C27A':'#8E2A3A'}">${lines}${doodles}</svg>
    ${lil}
    <div class="c"><small>a mulher</small>virtuosa</div>
    ${attrs}
    <div class="at">@rebecafortunato__</div></div>`;
}
document.body.innerHTML = post('light', 3) + post('dark', 9);
document.querySelectorAll('.post').forEach((p,i)=>p.id='p'+(i+1));
</script></body></html>
