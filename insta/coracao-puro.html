<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"CormorantR";src:url("fonts/cormorant-regular.ttf")}
@font-face{font-family:"Caslon";src:url("../site/assets/fonts/LibreCaslonText-Regular.ttf")}
body{margin:0;background:#333}
.post{width:1080px;position:relative;overflow:hidden;margin:0 0 20px;background:#000 url(gen/onca-agua.jpg) center/cover no-repeat}
.verso{position:absolute;left:110px;right:110px;text-align:center;font-family:"CormorantR";color:#FBF1E2;
  text-shadow:0 2px 14px rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.4)}
.ref{display:block;margin-top:26px;font-family:"Caslon";font-size:18px;letter-spacing:.32em;color:#F1D9B5}
.sombra{position:absolute;left:0;right:0;top:0;background:linear-gradient(rgba(8,4,2,.62),rgba(8,4,2,.35) 55%,rgba(8,4,2,0))}
.at{position:absolute;left:0;right:0;text-align:center;font-family:"Caslon";font-size:15px;letter-spacing:.28em;color:rgba(245,232,214,.8);text-shadow:0 1px 5px rgba(0,0,0,.6)}
</style></head><body>
<!-- Salmo 51:10 (NVI) sobre a foto da onça na água; @ discreto embaixo -->
<div class="post" id="p1" style="height:1920px;background-position:center top">
  <div class="sombra" style="height:900px"></div><div class="verso" style="top:250px;font-size:56px;line-height:1.25;left:60px;right:60px">Cria em mim um coração puro, ó Deus,<br>e renova dentro de mim<br>um espírito estável.<span class="ref">SALMOS 51.10</span></div>
  <div class="at" style="bottom:120px">@REBECAFORTUNATO__</div>
</div>
<div class="post" id="p2" style="height:1350px;background-position:center 70%">
  <div class="sombra" style="height:620px"></div><div class="verso" style="top:105px;font-size:52px;line-height:1.25">Cria em mim um coração puro, ó Deus,<br>e renova dentro de mim<br>um espírito estável.<span class="ref">SALMOS 51.10</span></div>
  <div class="at" style="bottom:44px">@REBECAFORTUNATO__</div>
</div>
</body></html>
