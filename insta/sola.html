<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"PlayfairI";src:url("fonts/playfair-italic.ttf")}
@font-face{font-family:"Pinyon";src:url("fonts/pinyon-script.ttf")}
@font-face{font-family:"Caslon";src:url("../site/assets/fonts/LibreCaslonText-Regular.ttf")}
body{margin:0;background:#333}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;margin:0 0 20px}
.post svg.bg{position:absolute;inset:0}
.at{position:absolute;left:0;right:0;top:432px;text-align:center;font-family:"Caslon";font-size:19px;letter-spacing:.3em}
.solas{position:absolute;left:0;right:0;top:492px;text-align:center;font-family:"PlayfairI";font-size:56px;line-height:1.16}
.tela{position:absolute;overflow:hidden}
.lado{position:absolute;mix-blend-mode:multiply;transform-origin:50% 100%}
.data{position:absolute;left:0;right:0;text-align:center;font-family:"Pinyon";font-size:54px}
.grao{position:absolute;inset:0;pointer-events:none}
</style></head><body>

<script>
const V = {
  creme: { papel:"#F2E3C6", traco:"#A23E28", fill1:"#E8A273", fill2:"#F0C49A",
           moldura:"#6E4530", molduraBorda:"#4A2C1E", trama:"#A9805F", tela:"#F6ECD6", texto:"#5A2418", at:"#A23E28" },
  marrom:{ papel:"#5A3726", traco:"#2E1A11", fill1:"#C4612F", fill2:"#9C3B26",
           moldura:"#B4552C", molduraBorda:"#7A3018", trama:"#DE9A64", tela:"#F6ECD6", texto:"#5A2418", at:"#A23E28" },
};
const DEFS = (id,c) => `<defs>
  <!-- flor jacobina -->
  <g id="${id}-flor">
    <path d="M-8,-2 C-30,-4 -40,-22 -30,-36 C-24,-44 -16,-40 -14,-34 C-12,-46 -4,-52 0,-44 C4,-52 12,-46 14,-34 C16,-40 24,-44 30,-36 C40,-22 30,-4 8,-2 Z" class="f2"/>
    <path d="M0,-6 L-21,-30 M0,-6 L-7,-40 M0,-6 L7,-40 M0,-6 L21,-30" class="ln"/>
    <path d="M-22,-14 Q-15,-21 -8,-14 Q-1,-21 6,-14 Q13,-21 20,-14" class="ln"/>
    <circle cx="-14" cy="-26" r="1.6" class="dt"/><circle cx="0" cy="-30" r="1.6" class="dt"/><circle cx="14" cy="-26" r="1.6" class="dt"/>
    <path d="M-14,22 C-20,10 -16,0 -8,-2 L8,-2 C16,0 20,10 14,22 C6,28 -6,28 -14,22 Z" class="f1"/>
    <path d="M-13,8 Q0,14 13,8 M-12,15 Q0,21 12,15" class="ln"/>
    <circle cx="-6" cy="4" r="1.4" class="dt"/><circle cx="0" cy="5" r="1.4" class="dt"/><circle cx="6" cy="4" r="1.4" class="dt"/>
    <path d="M0,26 L0,44" class="ln"/>
  </g>
  <g id="${id}-folha">
    <path d="M0,0 C8,-10 26,-10 36,0 C26,10 8,10 0,0 Z" class="f1"/>
    <path d="M2,0 L32,0 M10,0 L14,-5 M17,0 L21,-5 M24,0 L27,-4 M10,0 L14,5 M17,0 L21,5 M24,0 L27,4" class="ln"/>
  </g>
  <g id="${id}-ramo">
    <path d="M4,26 C30,32 54,12 62,-14 C68,-34 58,-50 46,-48 C36,-46 36,-34 44,-32" class="vn"/>
    <path d="M2,34 C10,58 40,72 64,66 C80,62 84,46 74,42 C66,40 64,50 70,52" class="vn"/>
    <use href="#${id}-folha" transform="translate(30,30) rotate(-28) scale(.8)"/>
    <use href="#${id}-folha" transform="translate(58,-4) rotate(-80) scale(.7)"/>
    <use href="#${id}-folha" transform="translate(24,52) rotate(40) scale(.75)"/>
    <circle cx="50" cy="16" r="1.6" class="dt"/><circle cx="44" cy="24" r="1.6" class="dt"/><circle cx="54" cy="8" r="1.6" class="dt"/>
    <circle cx="48" cy="72" r="1.5" class="dt"/><circle cx="56" cy="72" r="1.5" class="dt"/>
  </g>
  <g id="${id}-roseta">
    <g class="f2">
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z"/>
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z" transform="rotate(72)"/>
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z" transform="rotate(144)"/>
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z" transform="rotate(216)"/>
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z" transform="rotate(288)"/>
    </g>
    <circle r="3.4" class="f1"/><circle r="1.2" class="dt"/>
    <use href="#${id}-folha" transform="rotate(36) translate(13,0) scale(.42)"/>
    <use href="#${id}-folha" transform="rotate(108) translate(13,0) scale(.42)"/>
    <use href="#${id}-folha" transform="rotate(180) translate(13,0) scale(.42)"/>
    <use href="#${id}-folha" transform="rotate(252) translate(13,0) scale(.42)"/>
    <use href="#${id}-folha" transform="rotate(324) translate(13,0) scale(.42)"/>
  </g>
  <g id="${id}-motivo">
    <use href="#${id}-ramo"/><use href="#${id}-ramo" transform="scale(-1,1)"/>
    <use href="#${id}-flor"/>
  </g>
  <pattern id="${id}-papel" width="216" height="276" patternUnits="userSpaceOnUse">
    <use href="#${id}-motivo" x="108" y="138"/>
    <use href="#${id}-motivo" x="0" y="0"/><use href="#${id}-motivo" x="216" y="0"/>
    <use href="#${id}-motivo" x="0" y="276"/><use href="#${id}-motivo" x="216" y="276"/>
    <use href="#${id}-roseta" x="0" y="138"/><use href="#${id}-roseta" x="216" y="138"/>
    <use href="#${id}-roseta" x="108" y="0"/><use href="#${id}-roseta" x="108" y="276"/>
    <circle cx="54" cy="69" r="1.8" class="dt"/><circle cx="162" cy="69" r="1.8" class="dt"/>
    <circle cx="54" cy="207" r="1.8" class="dt"/><circle cx="162" cy="207" r="1.8" class="dt"/>
  </pattern>
  <pattern id="${id}-trama" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <path d="M0,0 L0,9 M0,0 L9,0" stroke="${c.trama}" stroke-width="1.3" opacity=".85"/>
  </pattern>
  <filter id="${id}-mancha" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="4" seed="7"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .40  0 0 0 0 .25  0 0 0 .55 -.18"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="${id}-sombra" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="6" dy="14" stdDeviation="14" flood-color="#3F1019" flood-opacity=".38"/>
  </filter>
  <filter id="${id}-dentro" x="0" y="0" width="100%" height="100%">
    <feFlood flood-color="#4b3a20" flood-opacity=".35"/>
    <feComposite in2="SourceAlpha" operator="out"/>
    <feGaussianBlur stdDeviation="7"/>
    <feOffset dx="2" dy="4"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="${id}-grao" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer>
  </filter>
</defs>`;
const F = { x:112, y:148, w:856, h:1104, b:28 };  // moldura
function post(id, v){
  const c = V[v], ix = F.x+F.b, iy = F.y+F.b, iw = F.w-2*F.b, ih = F.h-2*F.b;
  return `<div class="post" id="${id}">
  <svg class="bg" viewBox="0 0 1080 1350" width="1080" height="1350">${DEFS(id,c)}
    <style>
      #${id} .f1{fill:${c.fill1};stroke:${c.traco};stroke-width:1.4}
      #${id} .f2{fill:${c.fill2};stroke:${c.traco};stroke-width:1.4}
      #${id} .ln{fill:none;stroke:${c.traco};stroke-width:1.2;stroke-linecap:round}
      #${id} .vn{fill:none;stroke:${c.traco};stroke-width:1.8;stroke-linecap:round}
      #${id} .dt{fill:${c.traco}}
    </style>
    <rect width="1080" height="1350" fill="${c.papel}"/>
    <rect x="-100" y="-100" width="1300" height="1550" fill="url(#${id}-papel)"/>
    <rect width="1080" height="1350" fill="${c.papel}" filter="url(#${id}-mancha)" opacity=".5"/>
    <g filter="url(#${id}-sombra)">
      <rect x="${F.x}" y="${F.y}" width="${F.w}" height="${F.h}" fill="${c.moldura}"/>
    </g>
    <rect x="${F.x}" y="${F.y}" width="${F.w}" height="${F.h}" fill="url(#${id}-trama)"/>
    <rect x="${F.x+1.5}" y="${F.y+1.5}" width="${F.w-3}" height="${F.h-3}" fill="none" stroke="${c.molduraBorda}" stroke-width="3"/>
    <rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" fill="${c.tela}"/>
    <rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" fill="${c.tela}" filter="url(#${id}-mancha)" opacity=".55"/>
    <rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" fill="#000" filter="url(#${id}-dentro)"/>
    <rect x="${ix-1}" y="${iy-1}" width="${iw+2}" height="${ih+2}" fill="none" stroke="${c.molduraBorda}" stroke-width="2"/>
  </svg>
  <div class="at" style="color:${c.at}">@REBECAFORTUNATO__</div>
  <div class="solas" style="color:${c.texto}">Sola Scriptura<br>Sola Fide<br>Sola Gratia<br>Solus Christus<br>Soli Deo Gloria</div>
  <div class="tela" style="left:${ix}px;top:${iy}px;width:${iw}px;height:${ih}px"><img class="lado esq"><img class="lado dir"></div>
  <div class="data" style="color:${c.at};top:842px">31.10</div>
  <svg class="grao" viewBox="0 0 1080 1350">${DEFS(id,c)}<rect width="1080" height="1350" filter="url(#${id}-grao)"/></svg>
</div>`;
}
document.body.insertAdjacentHTML("beforeend", post("p1","creme") + post("p2","marrom"));

// Tulipas: tira o fundo creme e desbota um pouco o laranja, pra ficar vintage.
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return[h,s,l];}
function hsl2rgb(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return[f(0)*255,f(8)*255,f(4)*255];}
window.pronto = new Promise(res=>{
  const im = new Image();
  im.onload = ()=>{
    const cv = document.createElement("canvas"); cv.width=im.width; cv.height=im.height;
    const cx = cv.getContext("2d"); cx.drawImage(im,0,0);
    const d = cx.getImageData(0,0,cv.width,cv.height), p = d.data;
    const br=p[0], bgc=p[1], bb=p[2];
    let x0=1e9,y0=1e9,x1=0,y1=0;
    for(let i=0;i<p.length;i+=4){
      const r=p[i],g=p[i+1],b=p[i+2];
      const dist=Math.abs(r-br)+Math.abs(g-bgc)+Math.abs(b-bb);
      let a=Math.max(0,Math.min(1,(dist-14)/36));
      let [h,s,l]=rgb2hsl(r,g,b);
      if((h<55||h>320)&&s>.22){ // pétala
        s=s*.86; l=l*.97;
        [p[i],p[i+1],p[i+2]]=hsl2rgb(h,s,l);
      } else if(h>70&&h<200&&s>.12){          // folha: verde acinzentado
        s=s*.7; [p[i],p[i+1],p[i+2]]=hsl2rgb(h-8,s,l);
      }
      p[i+3]=Math.round(a*255);
      if(a>.5){const px=(i/4)%cv.width,py=Math.floor(i/4/cv.width);if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;}
    }
    cx.putImageData(d,0,0);
    const w=x1-x0+16,h=y1-y0+16, out=document.createElement("canvas"); out.width=w; out.height=h;
    out.getContext("2d").drawImage(cv,x0-8,y0-8,w,h,0,0,w,h);
    // Só as flores e o alto dos talos (corta antes do laço): entram pelas laterais da tela, uma de cada lado.
    const hc=Math.round(h*.68), top=document.createElement("canvas"); top.width=w; top.height=hc;
    top.getContext("2d").drawImage(out,0,0);
    const url=top.toDataURL("image/png"), W=520, H=Math.round(W*hc/w), iw=F.w-2*F.b, ih=F.h-2*F.b;
    // Em diagonal: à esquerda sobem de baixo, à direita caem do alto, como a tulipa caída da referência.
    const LADOS={ esq:{x:-215, y:ih*1.0, t:"rotate(44deg)"}, dir:{x:iw+215, y:ih*.0, t:"scaleX(-1) rotate(136deg)"} };
    document.querySelectorAll(".lado").forEach(el=>{
      const L=LADOS[el.classList.contains("esq")?"esq":"dir"];
      el.src=url; el.style.width=W+"px"; el.style.height=H+"px";
      el.style.top=(L.y-H)+"px"; el.style.left=(L.x-W/2)+"px"; el.style.transform=L.t;
    });
    res([w,h]);
  };
  im.src="gen/tulipas-laranja.png";
});
</script>
</body></html>
