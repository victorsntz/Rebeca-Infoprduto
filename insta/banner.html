<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"GreatVibes";src:url("fonts/great-vibes.ttf")}
@font-face{font-family:"Playfair";src:url("fonts/playfair-regular.ttf")}
body{margin:0;background:#333}
.capa{width:2560px;height:1440px;position:relative;overflow:hidden;margin:0 0 20px}
.capa svg{position:absolute;inset:0}
.nome{position:absolute;left:0;right:0;top:556px;text-align:center}
.nome .r{display:block;font-family:"GreatVibes";font-size:252px;line-height:1}
.nome .f{display:inline-flex;align-items:center;gap:44px;margin-top:6px;font-family:"Playfair";font-size:60px;letter-spacing:.46em;padding-left:.46em}
.nome .f i{display:block;width:150px;height:2px}
.guia{position:absolute;border:3px dashed rgba(255,255,255,.85);font:600 30px sans-serif;color:#fff;padding:8px 14px;box-sizing:border-box}
</style></head><body>
<script>
const DEFS = (id,c) => `<defs>
  <!-- flor jacobina -->
  <g id="${id}-flor">
    <path d="M-8,-2 C-30,-4 -40,-22 -30,-36 C-24,-44 -16,-40 -14,-34 C-12,-46 -4,-52 0,-44 C4,-52 12,-46 14,-34 C16,-40 24,-44 30,-36 C40,-22 30,-4 8,-2 Z" class="f2"/>
    <path d="M0,-6 L-21,-30 M0,-6 L-7,-40 M0,-6 L7,-40 M0,-6 L21,-30" class="ln"/>
    <path d="M-22,-14 Q-15,-21 -8,-14 Q-1,-21 6,-14 Q13,-21 20,-14" class="ln"/>
    <circle cx="-14" cy="-26" r="1.6" class="dt"/><circle cx="0" cy="-30" r="1.6" class="dt"/><circle cx="14" cy="-26" r="1.6" class="dt"/>
    <path d="M-14,22 C-20,10 -16,0 -8,-2 L8,-2 C16,0 20,10 14,22 C6,28 -6,28 -14,22 Z" class="f1"/>
    <path d="M-13,8 Q0,14 13,8 M-12,15 Q0,21 12,15" class="ln"/>
    <circle cx="-6" cy="4" r="1.4" class="dt"/><circle cx="0" cy="5" r="1.4" class="dt"/><circle cx="6" cy="4" r="1.4" class="dt"/>
    <path d="M0,26 L0,44" class="ln"/>
  </g>
  <g id="${id}-folha">
    <path d="M0,0 C8,-10 26,-10 36,0 C26,10 8,10 0,0 Z" class="f1"/>
    <path d="M2,0 L32,0 M10,0 L14,-5 M17,0 L21,-5 M24,0 L27,-4 M10,0 L14,5 M17,0 L21,5 M24,0 L27,4" class="ln"/>
  </g>
  <g id="${id}-ramo">
    <path d="M4,26 C30,32 54,12 62,-14 C68,-34 58,-50 46,-48 C36,-46 36,-34 44,-32" class="vn"/>
    <path d="M2,34 C10,58 40,72 64,66 C80,62 84,46 74,42 C66,40 64,50 70,52" class="vn"/>
    <use href="#${id}-folha" transform="translate(30,30) rotate(-28) scale(.8)"/>
    <use href="#${id}-folha" transform="translate(58,-4) rotate(-80) scale(.7)"/>
    <use href="#${id}-folha" transform="translate(24,52) rotate(40) scale(.75)"/>
    <circle cx="50" cy="16" r="1.6" class="dt"/><circle cx="44" cy="24" r="1.6" class="dt"/><circle cx="54" cy="8" r="1.6" class="dt"/>
    <circle cx="48" cy="72" r="1.5" class="dt"/><circle cx="56" cy="72" r="1.5" class="dt"/>
  </g>
  <g id="${id}-roseta">
    <g class="f2">
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z"/>
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z" transform="rotate(72)"/>
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z" transform="rotate(144)"/>
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z" transform="rotate(216)"/>
      <path d="M0,0 C-6,-6 -5,-14 0,-14 C5,-14 6,-6 0,0 Z" transform="rotate(288)"/>
    </g>
    <circle r="3.4" class="f1"/><circle r="1.2" class="dt"/>
    <use href="#${id}-folha" transform="rotate(36) translate(13,0) scale(.42)"/>
    <use href="#${id}-folha" transform="rotate(108) translate(13,0) scale(.42)"/>
    <use href="#${id}-folha" transform="rotate(180) translate(13,0) scale(.42)"/>
    <use href="#${id}-folha" transform="rotate(252) translate(13,0) scale(.42)"/>
    <use href="#${id}-folha" transform="rotate(324) translate(13,0) scale(.42)"/>
  </g>
  <g id="${id}-motivo">
    <use href="#${id}-ramo"/><use href="#${id}-ramo" transform="scale(-1,1)"/>
    <use href="#${id}-flor"/>
  </g>
  <pattern id="${id}-papel" width="216" height="276" patternUnits="userSpaceOnUse">
    <use href="#${id}-motivo" x="108" y="138"/>
    <use href="#${id}-motivo" x="0" y="0"/><use href="#${id}-motivo" x="216" y="0"/>
    <use href="#${id}-motivo" x="0" y="276"/><use href="#${id}-motivo" x="216" y="276"/>
    <use href="#${id}-roseta" x="0" y="138"/><use href="#${id}-roseta" x="216" y="138"/>
    <use href="#${id}-roseta" x="108" y="0"/><use href="#${id}-roseta" x="108" y="276"/>
    <circle cx="54" cy="69" r="1.8" class="dt"/><circle cx="162" cy="69" r="1.8" class="dt"/>
    <circle cx="54" cy="207" r="1.8" class="dt"/><circle cx="162" cy="207" r="1.8" class="dt"/>
  </pattern>
  <pattern id="${id}-trama" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <path d="M0,0 L0,9 M0,0 L9,0" stroke="${c.trama}" stroke-width="1.3" opacity=".85"/>
  </pattern>
  <filter id="${id}-mancha" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="4" seed="7"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .40  0 0 0 0 .25  0 0 0 .55 -.18"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="${id}-sombra" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="6" dy="14" stdDeviation="14" flood-color="#3F1019" flood-opacity=".38"/>
  </filter>
  <filter id="${id}-dentro" x="0" y="0" width="100%" height="100%">
    <feFlood flood-color="#4b3a20" flood-opacity=".35"/>
    <feComposite in2="SourceAlpha" operator="out"/>
    <feGaussianBlur stdDeviation="7"/>
    <feOffset dx="2" dy="4"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="${id}-grao" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer>
  </filter>
</defs>`;
const V = [
  { id:"b1", fundo:"#5E1A26", padrao:0, traco:"#000", fill1:"#000", fill2:"#000", script:"#F4E8DA", caps:"#D9B98A", linha:"#B8975B", luz:"rgba(255,226,205,.13)", sombra:"rgba(25,4,9,.55)" },
  { id:"b2", fundo:"#F3E9DF", padrao:0, traco:"#000", fill1:"#000", fill2:"#000", script:"#5E1A26", caps:"#8E2A3A", linha:"#B8975B", luz:"rgba(255,250,244,.7)", sombra:"rgba(120,70,60,.16)" },
];
// Cor direto nos desenhos (as cópias do padrão não herdam o CSS da página com segurança).
function pinta(d, c){
  return d.replace(/class="f1"/g, `fill="${c.fill1}" stroke="${c.traco}" stroke-width="1.4"`)
          .replace(/class="f2"/g, `fill="${c.fill2}" stroke="${c.traco}" stroke-width="1.4"`)
          .replace(/class="ln"/g, `fill="none" stroke="${c.traco}" stroke-width="1.2" stroke-linecap="round"`)
          .replace(/class="vn"/g, `fill="none" stroke="${c.traco}" stroke-width="1.8" stroke-linecap="round"`)
          .replace(/class="dt"/g, `fill="${c.traco}"`);
}
function capa(c){
  return `<div class="capa" id="${c.id}" style="background:${c.fundo}">
  <svg viewBox="0 0 2560 1440" width="2560" height="1440">${pinta(DEFS(c.id,{trama:c.linha}), c)}
    <style>
      #${c.id} .f1{fill:${c.fill1};stroke:${c.traco};stroke-width:1.4}
      #${c.id} .f2{fill:${c.fill2};stroke:${c.traco};stroke-width:1.4}
      #${c.id} .ln{fill:none;stroke:${c.traco};stroke-width:1.2;stroke-linecap:round}
      #${c.id} .vn{fill:none;stroke:${c.traco};stroke-width:1.8;stroke-linecap:round}
      #${c.id} .dt{fill:${c.traco}}
    </style>
    <defs>
      <radialGradient id="${c.id}-luz" cx="50%" cy="50%" r="42%"><stop offset="0" stop-color="${c.luz}"/><stop offset="1" stop-color="${c.luz}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${c.id}-vinheta" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="${c.sombra}" stop-opacity="0"/><stop offset="1" stop-color="${c.sombra}"/></radialGradient>
    </defs>
    <g opacity="${c.padrao}" transform="scale(1.6)"><rect x="-60" y="-60" width="1700" height="1000" fill="url(#${c.id}-papel)"/></g>
    <rect width="2560" height="1440" fill="url(#${c.id}-luz)"/>
    <rect width="2560" height="1440" fill="url(#${c.id}-vinheta)"/>
    <rect width="2560" height="1440" filter="url(#${c.id}-grao)"/>
  </svg>
  <div class="nome"><span class="r" style="color:${c.script}">Rebeca</span><span class="f" style="color:${c.caps}"><i style="background:${c.linha}"></i>FORTUNATO<i style="background:${c.linha}"></i></span></div>
</div>`;
}
document.body.insertAdjacentHTML("beforeend", V.map(capa).join(""));
// Guias de corte (só na prévia): TV = tudo; computador = faixa do meio; celular = miolo seguro.
if (location.search === "?guias") document.querySelectorAll(".capa").forEach(el => el.insertAdjacentHTML("beforeend",
  `<div class="guia" style="left:0;right:0;top:508px;height:424px">computador</div>
   <div class="guia" style="left:507px;width:1546px;top:508px;height:424px;border-color:#ffd27a;color:#ffd27a;text-align:right">celular (área segura)</div>
   <div class="guia" style="left:0;top:0;border:none">TV mostra a capa inteira</div>`));
</script>
</body></html>
