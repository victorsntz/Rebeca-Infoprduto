<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"PlayfairI";src:url("fonts/playfair-italic.ttf")}
@font-face{font-family:"Caslon";src:url("../site/assets/fonts/LibreCaslonText-Regular.ttf")}
body{margin:0;background:#333}
.post{width:1080px;position:relative;overflow:hidden;margin:0 0 20px}
.post img{display:block;width:1080px}
.verso{position:absolute;left:110px;right:110px;text-align:center;font-family:"PlayfairI";color:#5A2A22;text-shadow:0 0 18px rgba(246,240,236,.9)}
.ref{display:block;margin-top:22px;font-family:"Caslon";font-style:normal;font-size:19px;letter-spacing:.3em;color:#7A4A3A}
.at{position:absolute;left:0;right:0;text-align:center;font-family:"Caslon";font-size:16px;letter-spacing:.26em;color:#F4E9DF;text-shadow:0 1px 6px rgba(60,30,20,.45)}
</style></head><body>
<!-- Isaías 55:9 no céu da pintura (imagem que o Victor mandou), @ embaixo, na terra -->
<div class="post" id="p1">
  <img src="gen/jesus-buque-feed.jpg">
  <div class="verso" style="top:88px;font-size:47px;line-height:1.22">Assim como os céus são mais altos do que a terra, também os meus caminhos são mais altos do que os seus caminhos.<span class="ref">ISAÍAS 55:9</span></div>
  <div class="at" style="bottom:34px">@REBECAFORTUNATO__</div>
</div>
<div class="post" id="p2">
  <img src="gen/jesus-buque-story.jpg">
  <div class="verso" style="top:170px;font-size:54px;line-height:1.24">Assim como os céus são mais altos do que a terra, também os meus caminhos são mais altos do que os seus caminhos.<span class="ref">ISAÍAS 55:9</span></div>
  <div class="at" style="bottom:150px">@REBECAFORTUNATO__</div>
</div>
</body></html>
