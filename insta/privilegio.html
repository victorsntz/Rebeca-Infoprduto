<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Cormorant";src:url("fonts/cormorant-medium.ttf")}
@font-face{font-family:"CormorantR";src:url("fonts/cormorant-regular.ttf")}
@font-face{font-family:"Caslon";src:url("../site/assets/fonts/LibreCaslonText-Regular.ttf")}
body{margin:0;background:#333}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;margin:0 0 20px;background:#111}
.meia{position:absolute;left:0;width:1080px;height:675px;background-repeat:no-repeat}
.cheia{position:absolute;inset:0;background-repeat:no-repeat}
.t{position:absolute;color:#FBF7F0;font-family:"Cormorant";text-shadow:0 1px 10px rgba(0,0,0,.5),0 0 2px rgba(0,0,0,.35)}
.cima{left:60px;right:60px;top:0;height:675px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:56px;line-height:1.1}
.baixo{left:60px;right:60px;top:675px;height:675px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:50px;line-height:1.14}
.at{position:absolute;left:0;right:0;text-align:center;font-family:"Caslon";font-size:15px;letter-spacing:.3em;color:#F4EADF;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.grao{position:absolute;inset:0;pointer-events:none}
</style></head><body>
<script>
// Carrossel "Que privilégio é ser mulher": em cima sempre a mesma frase, embaixo o complemento.
// Pinturas antigas de domínio público (Wikimedia Commons), recortadas sem muito zoom.
const P = "gen/pinturas/";
// recorte: [arquivo, centro x, centro y (frações da imagem), largura do recorte (fração da largura da imagem)]
const S = [
  { cima:["chuva",.52,.42,.62],    baixo:["rosas",.50,.42,.92],   f:"e se encantar com uma flor<br>e uma tarde de chuva." },
  { cima:["perola",.47,.30,.86],   baixo:["cha",.50,.36,.78],     f:"e fazer do ato de se arrumar<br>um momento especial." },
  { cima:["mae",.50,.45,.96],      baixo:["flaming",.50,.46,.92], f:"e ter sido criada com o dom<br>de gerar uma vida dentro de si." },
  { cima:["amigas",.50,.25,.86],   baixo:["amigas",.56,.69,.58],  f:"e ter amigas de verdade,<br>celebrar a vitória delas sem competir." },
  { cima:["interior",.50,.50,.96], baixo:["leiteira",.46,.34,.72], f:"e transformar uma casa<br>em lar." },
  { cima:["shalott",.42,.45,.55],  baixo:["balanca",.56,.50,.42], f:"e ser quem Deus me criou pra ser,<br>sem precisar ser cópia de ninguém.", at:true },
];
const tam = {};
function fundo(el, [nome, cx, cy, cw], W, H){
  const [iw, ih] = tam[nome], s = cw ? W / (cw * iw) : Math.max(W / iw, H / ih);   // cw 0 = cobrir tudo
  const x = Math.min(0, Math.max(W - iw * s, W / 2 - cx * iw * s)), y = Math.min(0, Math.max(H - ih * s, H / 2 - cy * ih * s));
  el.style.backgroundImage = `url(${P}${nome}.jpg)`;
  el.style.backgroundSize = `${iw * s}px ${ih * s}px`;
  el.style.backgroundPosition = `${x}px ${y}px`;
}
const grao = `<svg class="grao" viewBox="0 0 1080 1350"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer></filter><rect width="1080" height="1350" filter="url(#g)"/></svg>`;
window.pronto = Promise.all([...new Set(S.flatMap(s => [s.cima, s.baixo, s.cheia]).filter(Boolean).map(x => x[0]))]
  .map(n => new Promise(r => { const im = new Image(); im.onload = () => { tam[n] = [im.naturalWidth, im.naturalHeight]; r(); }; im.src = P + n + ".jpg"; })))
.then(() => {
  S.forEach((s, i) => {
    const d = document.createElement("div"); d.className = "post"; d.id = "p" + (i + 1);
    if (s.cheia) {
      d.innerHTML = `<div class="cheia"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,6,4,.6),rgba(10,6,4,.25) 50%,rgba(10,6,4,0) 75%)"></div>
        <div class="t" style="left:84px;width:680px;top:360px;font-size:58px;line-height:1.1">Que privilégio é ser mulher</div>
        <div class="t" style="left:84px;width:520px;top:520px;font-family:CormorantR;font-size:37px;line-height:1.3">e reconhecer que Deus nos criou únicas, com uma identidade própria.<br><br>A gente não precisa ser cópia de ninguém pra revelar a beleza de quem foi criada pra ser.</div>
        <div class="at" style="top:70px">@REBECAFORTUNATO__</div>${grao}`;
      document.body.append(d); fundo(d.querySelector(".cheia"), s.cheia, 1080, 1350);
    } else {
      d.innerHTML = `<div class="meia" style="top:0"></div><div class="meia" style="top:675px"></div>
        <div style="position:absolute;left:0;right:0;top:200px;height:275px;background:radial-gradient(55% 50% at 50% 50%,rgba(12,7,4,.3),rgba(12,7,4,0))"></div>
        <div style="position:absolute;left:0;right:0;top:860px;height:300px;background:radial-gradient(55% 50% at 50% 50%,rgba(12,7,4,.3),rgba(12,7,4,0))"></div>
        <div class="t cima">Que privilégio é ser mulher</div>
        <div class="t baixo">${s.f}</div>${s.at ? '<div class="at" style="top:46px">@REBECAFORTUNATO__</div>' : ""}${grao}`;
      document.body.append(d);
      const [a, b] = d.querySelectorAll(".meia"); fundo(a, s.cima, 1080, 675); fundo(b, s.baixo, 1080, 675);
    }
  });
});
</script>
</body></html>
